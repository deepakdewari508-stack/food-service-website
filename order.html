<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FoodFly Order Online</title><link rel="stylesheet" href="styles.css"></head><body><header class="navbar sticky"><a class="logo" href="index.html">🍽️ FoodFly</a></header><main><section><h1>Checkout</h1><form class="form"><input placeholder="Full Name" required><input placeholder="Phone Number" required><textarea placeholder="Delivery Address" required></textarea><input placeholder="Landmark"><select required><option>Cash on Delivery</option><option>UPI</option><option>Card Payment</option><option>Wallet</option></select><div class="checkout-box"><h3>Order Summary</h3><p id="checkout-summary">Items in cart will appear here.</p></div><button class="btn btn-primary" type="submit">Place Order</button><button type="button" class="btn btn-outline" onclick="repeatOrder()">Repeat Last Order</button></form></section></main><script src="script.js"></script></body></html>
